server:
  port: 8081

spring:
  application:
    name: internaltools

  datasource:
    url: jdbc:postgresql://localhost:5432/internal_tools
    username: internal
    password: secret
    driver-class-name: org.postgresql.Driver

    jpa:
      hibernate:
        ddl-auto: validate
      show-sql: true
      database-platform: org.hibernate.dialect.PostgreSQLDialect

    flyway:
      enabled: true
